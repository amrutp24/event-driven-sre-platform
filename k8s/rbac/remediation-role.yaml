# What the runbook-action Lambda may do in the cluster.
#
# The Lambda calls the Kubernetes API as its IAM role. The module gives that
# role an EKS access entry in the "sre-remediation" group (kubernetes_group),
# and these bindings are the only things that group is granted. The Role and
# RoleBinding are for the apps namespace; add a copy for each other namespace
# in remediation_namespaces. Applied by scripts/deploy.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-remediation
  namespace: apps
rules:
  # Read, scale and restart deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  # scale raises the HPA's minimum instead of fighting it over replicas
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "patch"]
  # Look at pods to verify a rollout
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read app config
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-remediation
  namespace: apps
subjects:
  - kind: Group
    name: sre-remediation
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: sre-remediation
  apiGroup: rbac.authorization.k8s.io
---
# drain_node. Nodes are cluster-scoped and a node runs pods from every
# namespace, so this can't be a namespaced Role. Eviction goes through the
# Eviction API, which respects PodDisruptionBudgets; the Lambda has no
# permission to delete pods outright.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-remediation-nodes
rules:
  # Check the node's labels and readiness, then cordon it
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # Find the pods on the node
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-remediation-nodes
subjects:
  - kind: Group
    name: sre-remediation
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: sre-remediation-nodes
  apiGroup: rbac.authorization.k8s.io
