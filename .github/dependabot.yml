# Weekly update PRs, one per ecosystem and directory, with minor and patch
# bumps grouped together
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /
      - /examples/existing-cluster
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      terraform:
        patterns: ["*"]
        update-types: [minor, patch]

  # The complete example pins its majors on purpose: the EKS module v20 needs
  # AWS provider 5.x, and the VPC and IAM modules move with it. Dependabot
  # can't classify range requirements as majors, so the versions are named.
  # Moving to EKS v21 and provider 6 is a deliberate upgrade.
  - package-ecosystem: terraform
    directory: /examples/complete
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: [">= 6.0"]
      - dependency-name: "terraform-aws-modules/eks/aws"
        versions: [">= 21.0"]
      - dependency-name: "terraform-aws-modules/vpc/aws"
        versions: [">= 6.0"]
      - dependency-name: "terraform-aws-modules/iam/aws"
        versions: [">= 6.0"]
    groups:
      terraform-complete:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /lambda/alert_ingest
      - /lambda/runbook_action
      - /stepfunctions/tests
      - /examples/complete/apps/checkout
    schedule:
      interval: weekly
    # Only touch a requirement when its range no longer allows the new version,
    # so ">=" floors in the Lambdas' test requirements stay as they are
    versioning-strategy: increase-if-necessary
    # Test and app dependencies all in one PR; CI runs every suite on it
    groups:
      pip:
        patterns: ["*"]
