name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_VAR_FILE: examples/complete/ci.tfvars

jobs:
  terraform-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Checkov locally
        run: |
          pip install "pydantic<2.0.0" "checkov"

      # Settings and skipped checks (with reasons) are in .checkov.yaml.
      # soft-fail keeps failed checks from failing the job, but a Checkov
      # error still does. pipefail (shell: bash) keeps tee from hiding it.
      # The module is the repo root; the example is scanned on its own.
      - name: Run Checkov locally
        shell: bash
        run: |
          mkdir -p reports
          checkov --config-file .checkov.yaml -d . --framework terraform --skip-path examples | tee reports/checkov-module.txt
          checkov --config-file .checkov.yaml -d examples/complete --var-file ${{ env.TF_VAR_FILE }} | tee reports/checkov-complete.txt

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-security-results
          path: reports/
          retention-days: 30

  container-security-scan:
    runs-on: ubuntu-latest
    # The repo's default token is read-only; uploading to the Security tab needs this.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned to a commit, not @master (trivy-action was compromised in March 2026).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  lambda-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        lambda: [alert_ingest, runbook_action]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          cd lambda/${{ matrix.lambda }}
          pip install -r requirements-dev.txt

      - name: Run unit tests with moto mocks
        env:
          AWS_DEFAULT_REGION: us-east-1
          REGION: us-east-1
          CLUSTER_NAME: event-driven-sre-ci-eks
          ALLOWED_NAMESPACES: apps
          MAX_REPLICAS: "10"
          DEGRADED_PARAM: /checkout/degraded_mode
        run: |
          cd lambda/${{ matrix.lambda }}
          pytest tests/ -v --cov --cov-report=xml --cov-report=html --junitxml=test-results.xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.lambda }}-coverage
          path: |
            lambda/${{ matrix.lambda }}/coverage.xml
            lambda/${{ matrix.lambda }}/htmlcov/
            lambda/${{ matrix.lambda }}/test-results.xml
          retention-days: 30

  # Runs both state machine templates through a local simulator, with the
  # Lambda handlers on either side of the runbook
  stepfunctions-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          pip install -r stepfunctions/tests/requirements.txt

      - name: Run state machine tests
        run: |
          cd stepfunctions
          pytest tests/ -v --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stepfunctions-test-results
          path: stepfunctions/test-results.xml
          retention-days: 30

  infrastructure-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform fmt check
        run: |
          terraform fmt -check -recursive -diff

      # The module is the repo root; each example calls it with source = "../.."
      - name: Terraform validate (module and examples)
        shell: bash
        run: |
          for dir in . examples/complete examples/existing-cluster; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -input=false -backend=false
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - name: Install tflint
        run: |
          curl -L https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip -o tflint.zip
          unzip tflint.zip
          sudo mv tflint /usr/local/bin/

      # --force reports issues without failing the job; a tflint error still fails it
      - name: Run tflint
        run: |
          tflint --chdir=. --config="$PWD/.tflint.hcl" --force
          tflint --chdir=examples/complete --config="$PWD/.tflint.hcl" --var-file=ci.tfvars --force

  application-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd apps/checkout
          pip install -r requirements-dev.txt

      - name: Run application tests
        run: |
          cd apps/checkout
          pytest tests/ -v --cov --cov-report=xml --junitxml=test-results.xml

      - name: Upload app coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-coverage
          path: |
            apps/checkout/coverage.xml
            apps/checkout/htmlcov/
            apps/checkout/test-results.xml
          retention-days: 30

      