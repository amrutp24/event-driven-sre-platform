# pre-commit install, then the hooks run on every commit. Run them all with
# pre-commit run -a. terraform_tflint needs tflint and terraform_docs needs
# terraform-docs on PATH.
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 80c8033123f6d6b9ccd1a9458562ea4180742af7 # frozen: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml
        files: ^[^/]+\.tf$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # frozen: v0.17.0
    hooks:
      - id: ruff-check
