# Minimal production-minded overrides; expand as needed.
grafana:
  enabled: true

prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 15s

alertmanager:
  enabled: true

# EKS runs the scheduler, controller manager and etcd itself, so Prometheus
# can't scrape them, and the chart's rules would report them down for good
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
