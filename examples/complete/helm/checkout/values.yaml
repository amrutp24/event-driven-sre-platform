image:
  repository: "<YOUR_ECR_REPO>/checkout"
  tag: "latest"

# Only used when autoscaling is off
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  # Matches runbook_action's MAX_REPLICAS
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceAccount:
  name: checkout
  # IRSA role that can read the degraded-mode parameter. scripts/deploy.sh sets it.
  roleArn: ""

env:
  DEGRADED_MODE: "false"
  # The runbook's degrade action sets this; the app re-reads it every 15 seconds
  DEGRADED_PARAM: "/checkout/degraded_mode"
  AWS_REGION: "us-east-1"
  ERROR_RATE: "0.00"
  LATENCY_MS: "0"
  CHAOS: "false"

# Off until there's a real host and ACM certificate. With the placeholders the
# load balancer controller can't build an ALB, but it still creates a security
# group that then blocks the VPC from being deleted.
ingress:
  enabled: false
  host: "checkout.example.com"
  albGroup: "public"
  certificateArn: "<ACM_CERT_ARN>"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
