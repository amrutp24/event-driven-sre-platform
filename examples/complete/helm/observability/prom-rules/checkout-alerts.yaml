apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-alerts
  labels:
    release: mon
spec:
  groups:
  - name: checkout.rules
    rules:
    - alert: CheckoutHighErrorRate
      expr: |
        sum(rate(http_requests_total{route="/checkout",code=~"5.."}[5m]))
        /
        sum(rate(http_requests_total{route="/checkout"}[5m])) > 0.05
      for: 5m
      labels:
        severity: critical
        service: checkout
      annotations:
        summary: "Checkout 5xx rate > 5% (5m)"
        runbook: "stepfunctions:RunbookCheckoutDegradeOrRollback"

    - alert: CheckoutHighLatencyP95
      expr: |
        histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route="/checkout"}[5m])) by (le)) > 1
      for: 5m
      labels:
        severity: critical
        service: checkout
      annotations:
        summary: "Checkout p95 latency > 1s (5m)"
        runbook: "stepfunctions:RunbookCheckoutDegradeOrScale"

    # Only checkout's own targets. absent() covers every pod being gone,
    # when there's no up series left to be 0.
    - alert: CheckoutDown
      expr: |
        sum(up{namespace="apps", job="checkout"}) == 0
        or absent(up{namespace="apps", job="checkout"})
      for: 2m
      labels:
        severity: critical
        service: checkout
      annotations:
        summary: "Prometheus can't scrape any checkout pod"
        runbook: "stepfunctions:RunbookCheckoutRestart"
