# Sends alerts to POST /webhook. scripts/deploy.sh replaces <WEBHOOK_URL> with
# `terraform output alert_webhook_url` and creates the alertmanager-webhook-key
# secret from `terraform output alertmanager_api_key`.
alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-webhook-key/
    secrets:
      - alertmanager-webhook-key
  config:
    route:
      receiver: "aws-webhook"
      group_by: ["alertname", "service"]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 30m
      routes:
      # The chart's always-firing heartbeat alerts go nowhere instead of
      # becoming incidents
      - receiver: "null"
        matchers:
          - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: "null"
    - name: "aws-webhook"
      webhook_configs:
      - url: "<WEBHOOK_URL>"
        send_resolved: true
        http_config:
          http_headers:
            X-API-Key:
              files:
                - /etc/alertmanager/secrets/alertmanager-webhook-key/api-key
