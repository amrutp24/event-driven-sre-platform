# Generates the tables between the BEGIN_TF_DOCS and END_TF_DOCS markers in
# README.md. CI fails if they're out of date. To regenerate:
#   docker run --rm -v "$PWD:/terraform-docs" -w /terraform-docs \
#     quay.io/terraform-docs/terraform-docs:0.24.0-amd64 .
formatter: markdown table
version: ">= 0.24.0, < 1.0.0"

sections:
  show:
    - requirements
    - providers
    - resources
    - inputs
    - outputs

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  html: true
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
